<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="داؤد ٹریڈر" />
  
  <!-- SEO Optimization -->
  <title>داؤد ٹریڈر — ہول سیل آرڈر مینجمنٹ</title>
  <meta name="description" content="سیلزمین اور دکان کے مالکان کے لیے ایک بہترین ہول سیل آرڈر مینجمنٹ ایپلیکیشن۔ تیز، قابل اعتماد اور موبائل فرینڈلی بکنگ سسٹم۔" />
  <meta name="keywords" content="wholesale, order management, b2b, dawood trader, pos, booking app, salesman app" />
  <meta name="author" content="Dawood Trader" />
  <meta name="robots" content="index, follow" />
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="داؤد ٹریڈر — ہول سیل آرڈر مینجمنٹ" />
  <meta property="og:description" content="تیز ترین ہول سیل آرڈر مینجمنٹ اور بکنگ ایپلی کیشن۔" />
  <meta property="og:site_name" content="داؤد ٹریڈر" />
  
  <!-- Performance Optimization: Preconnect & Async Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap"></noscript>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  
  <!-- Schema Markup (JSON-LD) for better Google Search Indexing -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Dawood Trader",
    "description": "Premium wholesale order management application for salesmen and shop owners.",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "PKR"
    },
    "publisher": {
      "@type": "Organization",
      "name": "Dawood Traders"
    }
  }
  </script>
</head>
<body>
  <div id="install-banner" class="install-banner fade-in" style="display: none;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="background:var(--primary-gradient); width:40px; height:40px; border-radius:10px; display:flex; justify-content:center; align-items:center; color:white; font-weight:bold; font-size:20px;">D</div>
      <div>
        <div style="font-weight:700; font-size:15px; color:var(--text-primary);">داؤد ٹریڈر ایپ</div>
        <div style="font-size:12px; color:var(--text-secondary);">اپنے فون پر انسٹال کریں</div>
      </div>
    </div>
    <button id="install-btn" class="btn-small btn-primary" style="margin:0; padding:8px 16px;">انسٹال کریں</button>
  </div>
  <div id="app">
    <!-- UI Screens injected by JS -->
  </div>
  <!-- Defer loading of JS for better render speed -->
  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        }).catch(err => console.log('SW failed: ', err));
      });
    }
  </script>
</body>
</html>
